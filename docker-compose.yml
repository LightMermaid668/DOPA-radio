name: dopa-radio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dopa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
      POSTGRES_DB: ${POSTGRES_DB:-dopa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY を .env に設定してください}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY を .env に設定してください}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-dopa-media}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data

  web:
    build: .
    image: dopa-radio:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    command: sh -c "npm run db:migrate && npm run start"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: .
    image: dopa-radio:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    command: sh -c "npm run worker"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-dopa-radio.sosukeiwasaki.f5.si}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-media.dopa-radio.sosukeiwasaki.f5.si}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - garage

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN を .env に設定してください}
    depends_on:
      - caddy

volumes:
  pgdata:
  garagemeta:
  garagedata:
  caddydata:
  caddyconfig:
