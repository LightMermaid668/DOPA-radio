name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ci-placeholder-secret-for-build-only
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  ios-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: |
          cp GoogleConfig.xcconfig.example GoogleConfig.xcconfig
          xcodegen generate
      - name: Build iOS (simulator)
        working-directory: ios
        run: xcodebuild -project DopaRadio.xcodeproj -scheme DopaRadio -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Build macOS
        working-directory: ios
        run: xcodebuild -project DopaRadio.xcodeproj -scheme DopaRadioMac -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build | tail -5
