name: DopaRadio
options:
  bundleIdPrefix: si.f5.sosukeiwasaki
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "10.0.0"
targets:
  DopaRadio:
    type: application
    platform: iOS
    sources:
      - path: DopaRadio
        excludes:
          - "Info.plist"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    configFiles:
      Debug: GoogleConfig.xcconfig
      Release: GoogleConfig.xcconfig
    info:
      path: DopaRadio/Info.plist
      properties:
        CFBundleDisplayName: DOPA-radio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(GOOGLE_WEB_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(GOOGLE_IOS_REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: si.f5.sosukeiwasaki.doparadio
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q5V7R32G2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Googleログインの値は GoogleConfig.xcconfig に設定する（未設定ならボタン非表示）

  DopaRadioMac:
    type: application
    platform: macOS
    sources:
      - path: DopaRadio
        excludes:
          - "Info.plist"
    info:
      path: DopaRadioMac/Info.plist
      properties:
        CFBundleName: DOPA-radio
        CFBundleDisplayName: DOPA-radio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: DOPA-radio
        PRODUCT_BUNDLE_IDENTIFIER: si.f5.sosukeiwasaki.doparadio.mac
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        # GoogleログインはiOS版のみ（Macはメール/パスワード）
